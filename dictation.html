<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#1f9d52" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Denglish" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<title>Denglish Dictation</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="dictation.css" />
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('denglish.theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<!-- ============ DANH SACH BAI ============ -->
<div id="listView" class="hidden">
  <header class="appbar">
    <span class="brand">D<b>english</b></span>
    <nav class="navseg" aria-label="Chuyển trang">
      <a href="./">Từ vựng</a><a href="dictation.html" class="on">Dictation</a>
    </nav>
    <div class="spacer"></div>
    <button class="btn btn-sm btn-ghost" id="themeBtn" title="Sáng / tối">🌓</button>
  </header>
  <main class="page">
    <h1 class="dl-title">Luyện nghe – chép</h1>
    <p class="dl-sub" id="listNote">Các bài bạn đã tạo trên máy tính.</p>
    <div class="lessons" id="lessons"><div class="empty">Đang tải danh sách bài…</div></div>
  </main>
</div>

<!-- ============ MOT BAI ============ -->
<div id="lessonView" class="lesson hidden">
  <div class="lz-top">
    <a class="lz-back" href="dictation.html" title="Danh sách bài">‹</a>
    <span class="lz-title" id="lzTitle">Đang mở…</span>
    <button class="lz-icon" id="gearBtn" title="Tuỳ chọn">⚙</button>
  </div>

  <div class="lz-video" id="videoWrap">
    <div class="vbox"><div id="player"></div></div>
  </div>

  <div class="lz-tabs" role="tablist">
    <button class="lz-tab on" data-tab="dict">Chép chính tả</button>
    <button class="lz-tab" data-tab="full">Toàn bài</button>
  </div>

  <div class="lz-body" id="lzBody">
    <!-- chep chinh ta -->
    <section class="dict-pane" id="dictPane">
      <div class="transport">
        <button class="play-btn" id="playBtn" title="Nghe câu này">
          <svg class="ico-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
            <path d="M7.5 4.8v14.4a1 1 0 0 0 1.53.85l11.3-7.2a1 1 0 0 0 0-1.7L9.03 3.95A1 1 0 0 0 7.5 4.8z"/>
          </svg>
          <svg class="ico-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
            <rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/>
          </svg>
        </button>
        <button class="nav-btn" id="prevBtn" title="Câu trước">‹</button>
        <span class="counter" id="counter">1 / 1</span>
        <button class="nav-btn" id="nextBtn" title="Câu sau">›</button>
        <div class="spacer"></div>
        <button class="pill" id="speedBtn" title="Tốc độ">1×</button>
      </div>

      <div class="answer-wrap">
        <div class="answer-backdrop" id="answerBackdrop" aria-hidden="true"></div>
        <textarea id="answer" rows="3" placeholder="Gõ lại những gì bạn nghe được…" enterkeyhint="go"
                  spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>

      <div class="name-hint hidden" id="nameHint"></div>

      <div class="actions">
        <button class="btn btn-primary" id="checkBtn">Kiểm tra</button>
        <div class="verdict hidden" id="verdict"></div>
        <div class="spacer"></div>
        <button class="btn btn-sm btn-ghost" id="revealBtn">Xem đáp án</button>
        <button class="btn btn-sm" id="skipBtn">Bỏ qua</button>
      </div>

      <div class="result" id="result"></div>
      <div class="vi-line hidden" id="viLine"></div>

      <div class="answer-opts">
        <label class="check"><input type="checkbox" id="optImmediate" /> Hiện đáp án ngay</label>
        <label class="check"><input type="checkbox" id="optFull" /> Hiện toàn bộ đáp án</label>
      </div>

      <div class="progress-strip">
        <div class="pbar"><i id="pbar"></i></div>
        <span id="pctText">0%</span>
        <span class="chip ok">✓ <b id="scOk">0</b></span>
        <span class="chip no">✕ <b id="scNo">0</b></span>
        <span class="chip sk">↷ <b id="scSk">0</b></span>
      </div>
      <p class="tip">Chạm vào một từ trong đáp án để tra nghĩa và lưu vào sổ từ. Bôi đen nhiều từ để lưu cả cụm.</p>
    </section>

    <!-- toan bai -->
    <section class="full-pane hidden" id="fullPane">
      <div class="ft-opts">
        <label class="check"><input type="checkbox" id="ftVi" /> Bản dịch</label>
        <label class="check"><input type="checkbox" id="ftRepeat" /> Lặp câu</label>
        <label class="check"><input type="checkbox" id="ftAutoScroll" /> Tự cuộn</label>
      </div>
      <div class="ft-list" id="ftList"></div>
      <p class="tip" id="sourceNote"></p>
    </section>
  </div>
</div>

<div class="sheet-wrap hidden" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="wordpop" id="wordpop"></div>

<script src="js/wordpop.js"></script>
<script type="module" src="js/dictation.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
